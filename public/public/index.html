<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse internship opportunities and submit your application through the Internship Board.">
    <title>Internship Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Internship Board</h1>
            <p>Find internship opportunities and start your career journey.</p>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="internships-heading">
            <h2 id="internships-heading">Available Internships</h2>
            <p id="loadingMessage" role="status" aria-live="polite">Loading internships...</p>
            <div id="errorMessage" role="alert"></div>
            <div id="internshipList"></div>
        </section>

        <section aria-labelledby="application-heading" class="application-section">
            <h2 id="application-heading">Apply for an Internship</h2>
            <form id="applicationForm">
                <label for="internshipId">Internship ID</label>
                <input type="number" id="internshipId" name="internshipId" required min="1">

                <label for="applicantName">Full Name</label>
                <input type="text" id="applicantName" name="applicantName" autocomplete="name" required>

                <label for="applicantEmail">Email Address</label>
                <input type="email" id="applicantEmail" name="applicantEmail" autocomplete="email" required>

                <button type="submit">Submit Application</button>
                <p id="formMessage" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>Internship Board — Explore opportunities and build your future.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
